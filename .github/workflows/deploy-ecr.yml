      - name: Desplegar en EC2 mediante AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          EC2_FRONTEND_ID: ${{ secrets.EC2_FRONTEND_ID }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "=========================================="
          echo "Imagen a desplegar"
          echo "=========================================="
          echo "$IMAGE"

          REMOTE_SCRIPT=$(cat <<'C360_REMOTE'
          set -euo pipefail

          COMPOSE_DIR="/home/ec2-user/camisetas360-frontend"

          echo "=========================================="
          echo "CAMISETAS360 - DEPLOY FRONTEND"
          echo "=========================================="

          echo "Usuario SSM:"
          whoami

          echo "Imagen:"
          echo "$FRONTEND_IMAGE"

          cd "$COMPOSE_DIR"

          # ==========================================
          # Docker Compose debe ejecutarse como
          # ec2-user porque allí está disponible
          # el plugin compose.
          # ==========================================
          compose() {
            sudo -u ec2-user -H \
              env FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              docker compose "$@"
          }

          echo "=========================================="
          echo "Verificando Docker Compose"
          echo "=========================================="

          sudo -u ec2-user -H docker compose version

          # ==========================================
          # Imagen anterior
          # ==========================================

          OLD_CONTAINER_ID="$(docker ps -a \
            --filter "label=com.docker.compose.service=frontend" \
            --format '{{.ID}}' \
            | head -n 1)"

          OLD_IMAGE=""

          if [ -n "$OLD_CONTAINER_ID" ]; then
            OLD_IMAGE="$(docker inspect \
              --format '{{.Config.Image}}' \
              "$OLD_CONTAINER_ID")"

            echo "Contenedor anterior:"
            echo "$OLD_CONTAINER_ID"

            echo "Imagen anterior:"
            echo "$OLD_IMAGE"
          else
            echo "No existe un contenedor frontend anterior."
          fi

          # ==========================================
          # LOGIN ECR
          # ==========================================

          echo "=========================================="
          echo "Login ECR"
          echo "=========================================="

          aws ecr get-login-password \
            --region "$AWS_REGION_REMOTE" \
            | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          # ==========================================
          # PULL
          # ==========================================

          echo "=========================================="
          echo "Descargando imagen nueva"
          echo "=========================================="

          docker pull "$FRONTEND_IMAGE"

          # ==========================================
          # VALIDAR COMPOSE
          # ==========================================

          echo "=========================================="
          echo "Validando docker-compose.yml"
          echo "=========================================="

          compose config >/dev/null

          # ==========================================
          # DESPLEGAR
          # ==========================================

          echo "=========================================="
          echo "Creando nuevo contenedor"
          echo "=========================================="

          compose up \
            -d \
            --force-recreate \
            --no-deps \
            frontend

          # ==========================================
          # HEALTH CHECK
          # ==========================================

          echo "=========================================="
          echo "Esperando Nginx"
          echo "=========================================="

          DEPLOY_OK=false

          for attempt in $(seq 1 30); do
            echo "Health check $attempt/30"

            NEW_CONTAINER_ID="$(docker ps \
              --filter "label=com.docker.compose.service=frontend" \
              --format '{{.ID}}' \
              | head -n 1)"

            if [ -z "$NEW_CONTAINER_ID" ]; then
              echo "Contenedor todavía no disponible."
              sleep 3
              continue
            fi

            RUNNING="$(docker inspect \
              --format '{{.State.Running}}' \
              "$NEW_CONTAINER_ID" \
              2>/dev/null || echo false)"

            if [ "$RUNNING" != "true" ]; then
              echo "Contenedor todavía no está Running."
              sleep 3
              continue
            fi

            if ! docker exec "$NEW_CONTAINER_ID" \
              nginx -t >/dev/null 2>&1; then

              echo "Nginx todavía no está listo."
              sleep 3
              continue
            fi

            if curl \
              -k \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 3 \
              --max-time 5 \
              https://127.0.0.1/healthz \
              >/dev/null; then

              DEPLOY_OK=true

              echo "Health check correcto."
              break
            fi

            sleep 3
          done

          # ==========================================
          # FALLO + ROLLBACK
          # ==========================================

          if [ "$DEPLOY_OK" != "true" ]; then

            echo "=========================================="
            echo "ERROR: HEALTH CHECK FALLÓ"
            echo "=========================================="

            compose ps || true
            compose logs --tail=150 frontend || true

            if [ -n "$OLD_IMAGE" ]; then

              echo "=========================================="
              echo "ROLLBACK"
              echo "=========================================="

              echo "Restaurando:"
              echo "$OLD_IMAGE"

              FRONTEND_IMAGE="$OLD_IMAGE"

              compose up \
                -d \
                --force-recreate \
                --no-deps \
                frontend

              echo "Rollback completado."
            else
              echo "No existe imagen anterior para rollback."
            fi

            exit 1
          fi

          # ==========================================
          # COMPROBAR IMAGEN NUEVA
          # ==========================================

          NEW_CONTAINER_ID="$(docker ps \
            --filter "label=com.docker.compose.service=frontend" \
            --format '{{.ID}}' \
            | head -n 1)"

          ACTUAL_IMAGE="$(docker inspect \
            --format '{{.Config.Image}}' \
            "$NEW_CONTAINER_ID")"

          echo "=========================================="
          echo "VERIFICACIÓN FINAL"
          echo "=========================================="

          echo "Imagen esperada:"
          echo "$FRONTEND_IMAGE"

          echo "Imagen ejecutándose:"
          echo "$ACTUAL_IMAGE"

          if [ "$ACTUAL_IMAGE" != "$FRONTEND_IMAGE" ]; then
            echo "ERROR: El contenedor no está usando la imagen esperada."
            exit 1
          fi

          echo "=========================================="
          echo "DEPLOY CORRECTO"
          echo "=========================================="

          compose ps

          echo ""
          echo "Health:"
          curl -k --silent https://127.0.0.1/healthz

          echo ""
          echo "Frontend desplegado:"
          echo "$FRONTEND_IMAGE"

          C360_REMOTE
          )

          jq -n \
            --arg script "$REMOTE_SCRIPT" \
            --arg registry "$ECR_REGISTRY" \
            --arg image "$IMAGE" \
            --arg region "$AWS_REGION" \
            '{
              commands: [
                (
                  "ECR_REGISTRY=" + ($registry | @sh) + "\n"
                  + "FRONTEND_IMAGE=" + ($image | @sh) + "\n"
                  + "AWS_REGION_REMOTE=" + ($region | @sh) + "\n"
                  + $script
                )
              ]
            }' \
            > "$RUNNER_TEMP/ssm-parameters.json"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_FRONTEND_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Camisetas360 frontend $IMAGE_TAG" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_FRONTEND_ID" \
            || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_FRONTEND_ID" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              ResponseCode:ResponseCode,
              StandardOutputContent:StandardOutputContent,
              StandardErrorContent:StandardErrorContent
            }' \
            --output json)

          echo "$RESULT"

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          RESPONSE_CODE=$(echo "$RESULT" | jq -r '.ResponseCode')

          echo "=========================================="
          echo "SSM RESULT"
          echo "=========================================="

          echo "Status: $STATUS"
          echo "ResponseCode: $RESPONSE_CODE"

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: El despliegue remoto falló."
            exit 1
          fi

          if [ "$RESPONSE_CODE" != "0" ]; then
            echo "ERROR: Código remoto: $RESPONSE_CODE."
            exit 1
          fi

          echo "=========================================="
          echo "DEPLOY COMPLETADO"
          echo "=========================================="