name: Construir y Desplegar en EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: camisetas360-frontend

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, etiquetar y empujar la imagen
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY -a

      - name: Desplegar en EC2 vía AWS SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          EC2_FRONTEND_ID: ${{ secrets.EC2_FRONTEND_ID }}
        run: |
          set -euo pipefail
          # JSON estructurado: resuelve variables aquí y conserva los saltos de línea.
          jq -n --arg script "$(cat deploy/frontend.sh)" \
            --arg registry "$ECR_REGISTRY" \
            --arg image "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '{commands: [("bash -s -- " + ($registry|@sh) + " " + ($image|@sh) + " <<\u0027C360_DEPLOY\u0027\n" + $script + "\nC360_DEPLOY")]}' \
            > "$RUNNER_TEMP/ssm-parameters.json"
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_FRONTEND_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Desplegar nueva imagen de frontend en EC2" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_FRONTEND_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_FRONTEND_ID" \
            --query '{Status:Status,ResponseCode:ResponseCode}'
