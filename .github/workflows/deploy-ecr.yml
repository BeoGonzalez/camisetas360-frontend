name: Construir y Desplegar en ECS

# PR a main: solo calidad (tests + build). Push a main / manual: calidad y luego deploy.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: camisetas360-frontend
  ECS_CLUSTER: ecommerce-cluster
  ECS_SERVICE: frontend-service
  # Nombres creados por Terraform (ecs.tf)
  TASK_FAMILY: frontend-task
  CONTAINER_NAME: frontend
  # Configuración del SPA (Settings > Secrets and variables > Actions > Variables).
  # Son IDs públicos y URLs que terminan en el bundle: van como variables, no como secrets.
  NG_APP_ENTRA_CLIENT_ID: ${{ vars.NG_APP_ENTRA_CLIENT_ID }}
  NG_APP_ENTRA_TENANT_ID: ${{ vars.NG_APP_ENTRA_TENANT_ID }}
  NG_APP_API_SCOPE_BASE: ${{ vars.NG_APP_API_SCOPE_BASE }}
  NG_APP_API_BASE_URL: ${{ vars.NG_APP_API_BASE_URL }}
  NG_APP_TELEMETRIA_WS_URL: ${{ vars.NG_APP_TELEMETRIA_WS_URL }}

concurrency:
  # Un deploy a la vez; en PRs se cancela la corrida anterior de la misma rama.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy-frontend-ecs' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ========================================
  # CALIDAD: tests unitarios + build de producción
  # ========================================
  test:
    name: Tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Falla si la cobertura baja de los umbrales de angular.json (trinquete).
      - name: Tests unitarios (Vitest) con cobertura
        run: pnpm test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

      - name: Build de producción
        run: pnpm run build

  # ========================================
  # E2E HERMÉTICOS + RENDIMIENTO (Playwright)
  # La API se simula con page.route: no requiere backend. Los tests @backend (ms-pagos real)
  # no corren aquí. El proyecto "rendimiento" mide el build de producción (CWV + budget de JS).
  # ========================================
  e2e:
    name: E2E y rendimiento
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E herméticos
        run: pnpm e2e

      # En serie y en su propio paso: las mediciones no compiten por CPU con otros tests.
      - name: Rendimiento del build de producción
        run: pnpm e2e:rendimiento

      - name: Publicar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-and-deploy:
    name: Build, Push and Deploy to ECS
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout del código
        uses: actions/checkout@v4

      # ========================================
      # AWS
      #
      # Credenciales temporales del Learner Lab: expiran cuando
      # termina la sesión del lab. Hay que actualizar los tres
      # secrets cada vez que se inicia una sesión nueva.
      # ========================================
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar identidad de AWS
        run: |
          set -euo pipefail

          if ! aws sts get-caller-identity; then
            echo "::error::Credenciales AWS inválidas o expiradas. Actualiza los secrets desde AWS Details del Learner Lab."
            exit 1
          fi

      # ========================================
      # ECR LOGIN
      # ========================================
      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # El Learner Lab puede reiniciarse o cambiar de cuenta y el repositorio
      # ECR no sobrevive: se crea si no existe para que el push no falle.
      - name: Asegurar repositorio ECR
        run: |
          set -euo pipefail

          if aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "Repositorio $ECR_REPOSITORY ya existe."
          else
            echo "Repositorio $ECR_REPOSITORY no existe; creándolo..."
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true
          fi

      # ========================================
      # BUILD DOCKER
      # ========================================
      - name: Construir imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          IMAGE_SHA="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "=========================================="
          echo "Construyendo imagen Docker"
          echo "=========================================="
          echo "Latest: $IMAGE_LATEST"
          echo "SHA:    $IMAGE_SHA"

          docker build \
            --build-arg NG_APP_ENTRA_CLIENT_ID \
            --build-arg NG_APP_ENTRA_TENANT_ID \
            --build-arg NG_APP_API_SCOPE_BASE \
            --build-arg NG_APP_API_BASE_URL \
            --build-arg NG_APP_TELEMETRIA_WS_URL \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            .

          echo "Build completado"

      # ========================================
      # SMOKE TEST DE LA IMAGEN (antes de publicar)
      # nginx arranca sin app-pagos, /health, fallback SPA, gzip y caché.
      # ========================================
      - name: Smoke test de salud de la imagen
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: bash scripts/smoke-image.sh "$IMAGE"

      # ========================================
      # PUSH ECR
      # ========================================
      - name: Publicar imágenes en Amazon ECR
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          IMAGE_SHA="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE_LATEST"
          docker push "$IMAGE_SHA"

          echo "Imagen publicada correctamente:"
          echo "$IMAGE_SHA"

          # El deploy usa el tag con SHA (inmutable), no :latest.
          echo "uri=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

      # ========================================
      # DEPLOY EN AMAZON ECS (FARGATE)
      #
      # force-new-deployment por sí solo NO sirve: reinicia la tarea
      # con la MISMA task definition, y la que creó Terraform apunta a
      # nginx:latest, no a tu imagen de ECR. Por eso se registra una
      # revisión nueva de la task definition con la imagen recién
      # publicada y se actualiza el servicio para que la use.
      # ========================================
      # ========================================
      # PROVISIONAR ECS SI FALTA
      #
      # El Learner Lab se reinicia o cambia de cuenta y se pierde la
      # infraestructura. Este paso es idempotente: crea solo lo que no
      # existe (cluster, log group, task definition, security group y
      # servicio Fargate) y deja intacto lo que ya está (por ejemplo, lo
      # creado por Terraform). Red: VPC por defecto con IP pública, salvo
      # que se definan las variables ECS_SUBNETS / ECS_SECURITY_GROUP.
      # ========================================
      - name: Provisionar recursos de ECS si no existen
        env:
          IMAGE_URI: ${{ steps.push.outputs.uri }}
          # Opcionales (Settings > Variables): subnets separadas por coma y SG existente.
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          LOG_GROUP: /ecs/frontend-task
          CONTAINER_PORT: '80'
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          # El Learner Lab no permite crear roles IAM; LabRole ya existe y sirve
          # como execution role (pull de ECR + CloudWatch Logs).
          LAB_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/LabRole"

          # ---------- Cluster ----------
          CLUSTER_STATUS="$(aws ecs describe-clusters --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' --output text)"
          if [ "$CLUSTER_STATUS" != "ACTIVE" ]; then
            echo "Creando cluster $ECS_CLUSTER..."
            aws ecs create-cluster --cluster-name "$ECS_CLUSTER" \
              --capacity-providers FARGATE FARGATE_SPOT \
              --no-cli-pager >/dev/null
          else
            echo "Cluster $ECS_CLUSTER ya existe."
          fi

          # ---------- Log group ----------
          if [ "$(aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" \
                --query "length(logGroups[?logGroupName=='$LOG_GROUP'])" --output text)" = "0" ]; then
            echo "Creando log group $LOG_GROUP..."
            aws logs create-log-group --log-group-name "$LOG_GROUP"
            aws logs put-retention-policy --log-group-name "$LOG_GROUP" --retention-in-days 7
          fi

          # ---------- Task definition ----------
          # Si no existe, se registra una base con la imagen recién publicada.
          # Los pasos siguientes generan igual una revisión nueva con esa imagen.
          if ! aws ecs describe-task-definition --task-definition "$TASK_FAMILY" >/dev/null 2>&1; then
            echo "Registrando task definition base $TASK_FAMILY..."
            jq -n \
              --arg family "$TASK_FAMILY" \
              --arg role "$LAB_ROLE_ARN" \
              --arg name "$CONTAINER_NAME" \
              --arg image "$IMAGE_URI" \
              --arg logGroup "$LOG_GROUP" \
              --arg region "$AWS_REGION" \
              --argjson port "$CONTAINER_PORT" \
              '{
                family: $family,
                networkMode: "awsvpc",
                requiresCompatibilities: ["FARGATE"],
                cpu: "256",
                memory: "512",
                executionRoleArn: $role,
                taskRoleArn: $role,
                runtimePlatform: { cpuArchitecture: "X86_64", operatingSystemFamily: "LINUX" },
                containerDefinitions: [{
                  name: $name,
                  image: $image,
                  essential: true,
                  portMappings: [{ containerPort: $port, protocol: "tcp" }],
                  healthCheck: {
                    command: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"],
                    interval: 30, timeout: 5, retries: 3, startPeriod: 10
                  },
                  logConfiguration: {
                    logDriver: "awslogs",
                    options: {
                      "awslogs-group": $logGroup,
                      "awslogs-region": $region,
                      "awslogs-stream-prefix": "frontend"
                    }
                  }
                }]
              }' > base-task-definition.json
            aws ecs register-task-definition \
              --cli-input-json file://base-task-definition.json \
              --no-cli-pager >/dev/null
          else
            echo "Task definition $TASK_FAMILY ya existe."
          fi

          # ---------- Servicio ----------
          SERVICE_STATUS="$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" --query 'services[0].status' --output text)"

          if [ "$SERVICE_STATUS" = "DRAINING" ]; then
            echo "::error::El servicio $ECS_SERVICE se está eliminando (DRAINING). Reintenta en unos minutos."
            exit 1
          fi

          if [ "$SERVICE_STATUS" != "ACTIVE" ]; then
            echo "El servicio $ECS_SERVICE no existe (estado: $SERVICE_STATUS). Creándolo..."

            # Subnets: variable ECS_SUBNETS o las subnets por defecto de la VPC por defecto.
            if [ -n "${ECS_SUBNETS:-}" ]; then
              SUBNETS="$ECS_SUBNETS"
              VPC_ID="$(aws ec2 describe-subnets --subnet-ids "${SUBNETS%%,*}" \
                --query 'Subnets[0].VpcId' --output text)"
            else
              VPC_ID="$(aws ec2 describe-vpcs --filters Name=is-default,Values=true \
                --query 'Vpcs[0].VpcId' --output text)"
              if [ "$VPC_ID" = "None" ]; then
                echo "::error::No hay VPC por defecto. Define la variable ECS_SUBNETS (y opcionalmente ECS_SECURITY_GROUP)."
                exit 1
              fi
              SUBNETS="$(aws ec2 describe-subnets \
                --filters Name=vpc-id,Values="$VPC_ID" Name=default-for-az,Values=true \
                --query 'Subnets[].SubnetId' --output text | tr '\t' ',')"
            fi
            if [ -z "$SUBNETS" ] || [ "$SUBNETS" = "None" ]; then
              echo "::error::No se encontraron subnets para el servicio."
              exit 1
            fi

            # Security group: variable ECS_SECURITY_GROUP o uno propio con HTTP abierto.
            if [ -n "${ECS_SECURITY_GROUP:-}" ]; then
              SG_ID="$ECS_SECURITY_GROUP"
            else
              SG_NAME="${ECS_SERVICE}-sg"
              SG_ID="$(aws ec2 describe-security-groups \
                --filters Name=vpc-id,Values="$VPC_ID" Name=group-name,Values="$SG_NAME" \
                --query 'SecurityGroups[0].GroupId' --output text)"
              if [ "$SG_ID" = "None" ]; then
                echo "Creando security group $SG_NAME..."
                SG_ID="$(aws ec2 create-security-group --group-name "$SG_NAME" \
                  --description "HTTP publico para $ECS_SERVICE" --vpc-id "$VPC_ID" \
                  --query GroupId --output text)"
                aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
                  --protocol tcp --port "$CONTAINER_PORT" --cidr 0.0.0.0/0 >/dev/null
              fi
            fi

            echo "VPC: $VPC_ID | Subnets: $SUBNETS | SG: $SG_ID"
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --task-definition "$TASK_FAMILY" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
              --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}" \
              --no-cli-pager >/dev/null
            echo "Servicio $ECS_SERVICE creado."
          else
            echo "Servicio $ECS_SERVICE ya existe."
          fi

      - name: Descargar task definition actual
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' \
            > current-task-definition.json

          jq -e \
            --arg container "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $container)' \
            current-task-definition.json \
            >/dev/null

      # describe-task-definition devuelve campos de solo lectura que
      # register-task-definition no acepta. Se eliminan y se cambia
      # solo la imagen del contenedor.
      - name: Generar nueva task definition con la imagen publicada
        env:
          IMAGE_URI: ${{ steps.push.outputs.uri }}
        run: |
          set -euo pipefail

          jq \
            --arg container "$CONTAINER_NAME" \
            --arg image "$IMAGE_URI" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            (
              .containerDefinitions[]
              | select(.name == $container)
              | .image
            ) = $image
            ' \
            current-task-definition.json \
            > new-task-definition.json

          echo "Imagen en la nueva task definition:"
          jq -r \
            --arg container "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $container) | .image' \
            new-task-definition.json

      - name: Registrar nueva revisión de la task definition
        id: register
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://new-task-definition.json \
              --region "$AWS_REGION" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "Registrada: $TASK_DEFINITION_ARN"
          echo "arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      # No se pasa --desired-count: se respeta el valor actual del
      # servicio y el auto scaling (1 a 4 tareas).
      - name: Actualizar servicio en Amazon ECS
        env:
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null

          echo "Despliegue iniciado:"
          echo "Servicio:        $ECS_SERVICE"
          echo "Task definition: $TASK_DEFINITION_ARN"

      # El comando wait corta a los 10 minutos, por eso se reintenta
      # hasta 2 veces. Si falla, imprime eventos y el motivo de las
      # tareas detenidas para poder diagnosticar.
      - name: Esperar a que el servicio se estabilice
        run: |
          set -euo pipefail

          echo "Esperando a $ECS_SERVICE..."

          ATTEMPTS=0
          MAX_ATTEMPTS=2

          while (( ATTEMPTS < MAX_ATTEMPTS )); do
            if aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION"; then

              echo "$ECS_SERVICE está estable."
              exit 0
            else
              ATTEMPTS=$((ATTEMPTS + 1))
              echo "Intento ${ATTEMPTS} de ${MAX_ATTEMPTS}: el servicio aún no se estabiliza."
            fi
          done

          echo "::error::El servicio $ECS_SERVICE no se estabilizó después de $((MAX_ATTEMPTS * 10)) minutos."

          echo "--- Últimos eventos del servicio ---"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].events[:10].message' \
            --output json

          echo "--- Tareas detenidas recientemente ---"
          STOPPED="$(
            aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status STOPPED \
              --region "$AWS_REGION" \
              --query 'taskArns[:3]' \
              --output text
          )"

          if [ -n "$STOPPED" ] && [ "$STOPPED" != "None" ]; then
            # shellcheck disable=SC2086
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks $STOPPED \
              --region "$AWS_REGION" \
              --query 'tasks[].{Reason:stoppedReason,Containers:containers[].{Name:name,Reason:reason,ExitCode:exitCode}}' \
              --output json
          fi

          exit 1

      - name: Verificar el servicio desplegado
        env:
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.arn }}
          IMAGE_URI: ${{ steps.push.outputs.uri }}
        run: |
          set -euo pipefail

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query '
              services[0].{
                Service:serviceName,
                Status:status,
                Desired:desiredCount,
                Running:runningCount,
                Pending:pendingCount,
                TaskDefinition:taskDefinition
              }
            ' \
            --output table

          CURRENT_TD="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          DESIRED="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].desiredCount' \
              --output text
          )"

          RUNNING="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].runningCount' \
              --output text
          )"

          if [ "$CURRENT_TD" != "$TASK_DEFINITION_ARN" ]; then
            echo "::error::El servicio no quedó con la task definition nueva (actual: $CURRENT_TD)."
            exit 1
          fi

          if [ "$DESIRED" -lt 1 ] || [ "$RUNNING" -lt "$DESIRED" ]; then
            echo "::error::El servicio no tiene todas sus tareas corriendo (running=$RUNNING, desired=$DESIRED)."
            exit 1
          fi

          # Sin ALB, cada tarea tiene su IP pública (cambia en cada deploy).
          PUBLIC_IP="sin IP pública"
          TASK_ARN="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --desired-status RUNNING --query 'taskArns[0]' --output text)"
          if [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
            ENI_ID="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
              --output text)"
            if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
              PUBLIC_IP="$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" \
                --query 'NetworkInterfaces[0].Association.PublicIp' --output text)"
            fi
          fi
          echo "URL de la tarea: http://$PUBLIC_IP"

          {
            echo "## Camisetas360 Frontend"
            echo
            echo "- URL: http://$PUBLIC_IP"
            echo "- Cluster: $ECS_CLUSTER (Fargate)"
            echo "- Servicio: $ECS_SERVICE"
            echo "- Imagen: \`$IMAGE_URI\`"
            echo "- Task definition: \`$TASK_DEFINITION_ARN\`"
            echo "- Resultado: exitoso"
          } >> "$GITHUB_STEP_SUMMARY"
