name: Construir y Desplegar en ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: camisetas360-frontend
  ECS_CLUSTER: ecommerce-cluster
  ECS_SERVICE: frontend-service

concurrency:
  group: deploy-frontend-ecs
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout del código
        uses: actions/checkout@v4

      # ========================================
      # AWS
      # ========================================
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ========================================
      # ECR LOGIN
      # ========================================
      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================
      # BUILD DOCKER
      # ========================================
      - name: Construir imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          IMAGE_SHA="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "=========================================="
          echo "Construyendo imagen Docker"
          echo "=========================================="
          echo "Latest: $IMAGE_LATEST"
          echo "SHA:    $IMAGE_SHA"

          docker build \
            -t "$IMAGE_LATEST" \
            -t "$IMAGE_SHA" \
            .

          echo "=========================================="
          echo "Build completado"
          echo "=========================================="

      # ========================================
      # PUSH ECR
      # ========================================
      - name: Publicar imágenes en Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_LATEST="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          IMAGE_SHA="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "=========================================="
          echo "Publicando imagen latest"
          echo "=========================================="
          docker push "$IMAGE_LATEST"

          echo "=========================================="
          echo "Publicando imagen con SHA"
          echo "=========================================="
          docker push "$IMAGE_SHA"

          echo "=========================================="
          echo "Imagen publicada correctamente"
          echo "=========================================="
          echo "$IMAGE_SHA"

      # ========================================
      # DEPLOY EN AMAZON ECS (FARGATE)
      # ========================================
      - name: Actualizar servicio en Amazon ECS
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Actualizando servicio ECS"
          echo "=========================================="
          echo "Cluster: $ECS_CLUSTER"
          echo "Service: $ECS_SERVICE"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

          echo "=========================================="
          echo "¡Despliegue a ECS ordenado con éxito!"
          echo "=========================================="
