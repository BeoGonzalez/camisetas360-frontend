<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Lookbook</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#fbfaf3;color:#1b1a17;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.bar{height:34px;background:#eee9df;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
nav{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.logo{font-weight:800;letter-spacing:.45em;font-size:18px}
.links{display:flex;gap:36px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.hero{display:grid;grid-template-columns:1.2fr 1fr;height:786px}
.studio{background:#e4ded1;display:flex;align-items:center;justify-content:center}
.shirt{width:360px;height:360px;background:#1b1a17;clip-path:polygon(25% 0,40% 8%,60% 8%,75% 0,100% 18%,88% 38%,80% 33%,80% 100%,20% 100%,20% 33%,12% 38%,0 18%)}
.copy{padding:96px 72px;display:flex;flex-direction:column;justify-content:center}
.kick{font-size:12px;letter-spacing:.3em;text-transform:uppercase}
h1{font-size:96px;letter-spacing:.32em;line-height:1;text-transform:uppercase;font-weight:300;margin:28px 0}
p{font-size:20px;line-height:1.5;max-width:420px}
.cta{margin-top:40px;font-size:14px;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
</style></head><body>
<div class="bar">Nueva temporada · Premier League 2026/27</div>
<nav><div class="logo">CAMISETAS360</div><div class="links"><span>Equipos</span><span>Local</span><span>Visitante</span><span>Alternativa</span><span>Carrito (0)</span></div></nav>
<div class="hero"><div class="studio"><div class="shirt"></div></div>
<div class="copy"><div class="kick">Lanzamiento · Local 26/27</div><h1>Arsenal</h1><p>La camiseta de local de la temporada 2026/27, en stock en todas las tallas.</p><div class="cta">Ver la colección →</div></div></div>
</body></html>
