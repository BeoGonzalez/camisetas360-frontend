<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Canon</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#ffffff;color:#111;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid #e5e5e5}
.logo{font-weight:800;font-size:22px}
.links{display:flex;gap:28px;font-size:15px}
.banner{height:300px;background:#f2f2f2;display:flex;align-items:center;padding:0 80px}
.banner h1{font-size:56px;font-weight:700}
.main{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:32px 48px}
.filters div{height:28px;background:#f2f2f2;margin-bottom:14px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card .img{height:220px;background:#f2f2f2;border-radius:10px}
.card p{margin-top:10px;font-size:16px}
</style></head><body>
<nav><div class="logo">Camisetas360</div><div class="links"><span>Catálogo</span><span>Ofertas</span><span>Carrito</span></div></nav>
<div class="banner"><h1>Camisetas 2026/27</h1></div>
<div class="main"><div class="filters"><div></div><div></div><div></div><div></div></div>
<div class="grid"><div class="card"><div class="img"></div><p>Camiseta Arsenal Local</p></div><div class="card"><div class="img"></div><p>Camiseta Chelsea Local</p></div><div class="card"><div class="img"></div><p>Camiseta Liverpool Local</p></div><div class="card"><div class="img"></div><p>Camiseta Everton Local</p></div></div></div>
</body></html>
