server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # HEALTH CHECK
    # ==========================================

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ==========================================
    # STATIC ASSETS
    # ==========================================

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ==========================================
    # ANGULAR SPA
    # ==========================================

    location / {
        try_files $uri $uri/ /index.html;
    }
}