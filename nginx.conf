server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # COMPRESIÓN (~714 kB de JS -> ~190 kB transferidos)
    # ==========================================

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # ==========================================
    # HEALTH CHECK
    # ==========================================

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ==========================================
    # STATIC ASSETS
    # ==========================================

    # JS/CSS llevan hash en el nombre (outputHashing: all): caché inmutable de 1 año.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # ==========================================
    # PROXY LOCAL MICROSERVICIO PAGOS (docker compose)
    # ==========================================
    # Con variable + resolver, nginx resuelve app-pagos en cada petición y ARRANCA aunque ese
    # host no exista (p. ej. en ECS, donde el frontend llama al API Gateway). Con el host fijo,
    # nginx fallaba al iniciar: "host not found in upstream".

    location /api/v1/pago/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $pagos_upstream http://app-pagos:8080;
        proxy_pass $pagos_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # ANGULAR SPA
    # ==========================================

    location / {
        # index.html nunca se cachea: así un deploy nuevo se ve de inmediato.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
