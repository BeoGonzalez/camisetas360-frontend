server {
    listen 443 ssl;
    server_name 100.49.172.129;

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # TLS
    # ==========================================
    ssl_certificate /etc/letsencrypt/live/100.49.172.129/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/100.49.172.129/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers
        ECDHE-ECDSA-AES128-GCM-SHA256:
        ECDHE-RSA-AES128-GCM-SHA256:
        ECDHE-ECDSA-AES256-GCM-SHA384:
        ECDHE-RSA-AES256-GCM-SHA384:
        ECDHE-ECDSA-CHACHA20-POLY1305:
        ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_tickets off;

    # ==========================================
    # HEALTH CHECK
    # ==========================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ==========================================
    # INDEX.HTML
    # No guardar en caché porque referencia los
    # bundles actuales de Angular.
    # ==========================================
    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ==========================================
    # ASSETS
    # ==========================================
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bundles Angular con hash
    location ~* \.(?:js|css|woff|woff2|png|jpg|jpeg|gif|svg|ico|webp)$ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ==========================================
    # ANGULAR SPA
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # HEADERS BÁSICOS
    # ==========================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}