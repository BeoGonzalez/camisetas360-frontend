# Incorporar este location al servidor HTTP existente mientras se emite
# el primer certificado. No sustituir configuraciones remotas sin inspección.
server {
    listen 80;
    server_name 100.49.172.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://100.49.172.129$request_uri;
    }
}
